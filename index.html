<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phillip's Page</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #0f1419; color: #e6e9ef; margin: 0; padding: 0; }
    header { padding: 40px 20px 10px; text-align: center; }
    h1 { margin: 0 0 8px; }
    .sub { color: #8b95a5; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; max-width: 1000px; margin: 30px auto; padding: 0 20px; }
    .card { background: #1a2029; border-radius: 12px; padding: 20px; }
    .big { font-size: 2.2rem; font-weight: 700; margin: 6px 0; }
    .label { color: #8b95a5; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .inverted { color: #ff6b6b; }
    .normal { color: #4cd964; }
    footer { text-align: center; color: #8b95a5; font-size: 0.85rem; padding: 20px; }
  </style>
</head>
<body>
  <header>
    <h1>Hi, I'm Phillip</h1>
    <div class="sub">Tracking Bitcoin and the yield curve</div>
  </header>

  <div class="grid">
    <div class="card">
      <div class="label">Bitcoin (USD)</div>
      <div class="big" id="btc-price">...</div>
      <div id="btc-change"></div>
      <canvas id="btc-chart"></canvas>
    </div>

    <div class="card">
      <div class="label">10Y minus 2Y Treasury spread</div>
      <div class="big" id="curve-value">...</div>
      <div id="curve-status"></div>
      <canvas id="curve-chart"></canvas>
       <div id="curve-explainer" style="margin-top: 16px; padding-top: 14px; border-top: 1px solid #2a3340; font-size: 0.92rem; line-height: 1.5; color: #b8c0cc;">
        <div id="explainer-headline" style="font-weight: 700; font-size: 1rem; margin-bottom: 6px;"></div>
        <p id="explainer-body" style="margin: 0 0 8px;"></p>
        <p style="margin: 0; color: #8b95a5; font-size: 0.82rem;">Historically, inversions have come before most US recessions, usually 6 to 24 months ahead, but the timing is unreliable and it is not a guarantee.</p>
      </div>
    </div>
  </div>

  <div class="grid">
    <div class="card" style="grid-column: 1 / -1;">
      <div class="label">Summary</div>
      <p id="summary">Loading...</p>
    </div>
  </div>

  <footer>Last updated: <span id="updated">...</span></footer>

  <script>
    fetch('data.json?t=' + Date.now())
      .then(r => r.json())
      .then(d => {
        document.getElementById('btc-price').textContent =
          '$' + d.bitcoin.price.toLocaleString(undefined, {maximumFractionDigits: 0});
        const ch = d.bitcoin.change_24h;
        const chEl = document.getElementById('btc-change');
        chEl.textContent = (ch >= 0 ? '+' : '') + ch.toFixed(2) + '% in 24h';
        chEl.className = ch >= 0 ? 'normal' : 'inverted';

        const spread = d.yield_curve.latest;
        document.getElementById('curve-value').textContent = spread.toFixed(2) + '%';
        const st = document.getElementById('curve-status');
        if (spread < 0) { st.textContent = 'INVERTED'; st.className = 'inverted'; }
        else { st.textContent = 'Normal (positive slope)'; st.className = 'normal'; }

        document.getElementById('summary').textContent = d.summary;
                const head = document.getElementById('explainer-headline');
        const body = document.getElementById('explainer-body');
        const abs = Math.abs(spread).toFixed(2);
        if (spread < 0) {
          head.textContent = 'Inverted by ' + abs + ' percentage points';
          head.style.color = '#ff6b6b';
          body.textContent = 'The 2-year Treasury yield is currently higher than the 10-year yield. Normally you are paid more for lending for longer, so when short rates beat long rates, the bond market is signalling that it expects growth to weaken and the Fed to cut rates in future. The deeper the dip below zero, the stronger the signal.';
        } else {
          head.textContent = 'Normal: 10-year is ' + abs + ' percentage points above the 2-year';
          head.style.color = '#4cd964';
          body.textContent = 'The 10-year Treasury yield is above the 2-year yield, which is the usual upward-sloping shape. It means lenders are being paid more for tying money up longer, and the bond market is not flashing its classic recession warning right now. Note that recessions have often started after the curve un-inverts, so a return to positive is not automatically all clear.';
        }
        document.getElementById('updated').textContent = new Date(d.updated).toLocaleString();

        new Chart(document.getElementById('btc-chart'), {
          type: 'line',
          data: { labels: d.bitcoin.history.map(p => p[0]),
                  datasets: [{ data: d.bitcoin.history.map(p => p[1]), borderColor: '#f7931a', pointRadius: 0, tension: 0.2 }] },
          options: { plugins: { legend: { display: false } }, scales: { x: { ticks: { maxTicksLimit: 5 } } } }
        });

        const curveLabels = d.yield_curve.history.map(p => p[0]);
        const curveValues = d.yield_curve.history.map(p => p[1]);

        new Chart(document.getElementById('curve-chart'), {
          type: 'line',
          data: {
            labels: curveLabels,
            datasets: [
              {
                label: '10Y minus 2Y spread',
                data: curveValues,
                borderColor: '#5ac8fa',
                borderWidth: 1.5,
                pointRadius: 0,
                pointHoverRadius: 5,
                tension: 0.1,
                fill: {
                  target: 'origin',
                  above: 'rgba(76, 217, 100, 0.10)',
                  below: 'rgba(255, 107, 107, 0.35)'
                }
              },
              {
                label: 'Zero line',
                data: curveLabels.map(() => 0),
                borderColor: '#ffffff',
                borderWidth: 1,
                borderDash: [6, 6],
                pointRadius: 0,
                pointHoverRadius: 0,
                fill: false
              }
            ]
          },
          options: {
            interaction: { mode: 'index', intersect: false },
            plugins: {
              legend: { display: false },
              tooltip: {
                filter: item => item.datasetIndex === 0,
                callbacks: {
                  label: ctx => ctx.parsed.y.toFixed(2) + '%' + (ctx.parsed.y < 0 ? ' (inverted)' : '')
                }
              }
            },
            scales: {
              x: { ticks: { maxTicksLimit: 6 } },
              y: { ticks: { callback: v => v + '%' } }
            }
          }
        });
      })
      .catch(e => { document.getElementById('summary').textContent = 'Data not available yet. Run the update workflow once (see Step 5).'; });
  </script>
</body>
</html>
